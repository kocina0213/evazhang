<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#193b31"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="EVA功过格"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><title>EVA 功过格 · 日日自省</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#193b31;background:#f5f6ef}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:22px 18px 95px}h1{font-size:26px;margin:8px 0}h2{font-size:18px}p,.muted{color:#61756a}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700}section,.tile{background:white;border-radius:19px;padding:18px;margin:15px 0;box-shadow:0 3px 16px #193b3110}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{text-align:center;margin:0;padding:15px 6px}.tile strong{display:block;font-size:26px;margin:5px}button,input,select,textarea{font:inherit}button{background:#193b31;color:white;border:0;border-radius:11px;padding:12px 16px;cursor:pointer}button.alt{background:#e8eee7;color:#193b31}button.danger{background:#f8e7e4;color:#922d2d}input,select,textarea{width:100%;border:1px solid #d5ded5;border-radius:10px;padding:11px;margin:6px 0 12px;background:white}textarea{min-height:88px;resize:vertical}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.row>*{min-width:0}.entry{padding:12px 0;border-bottom:1px solid #eef0e9}.entry:last-child{border:0}.small{font-size:12px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{flex:1;padding:10px}.tree{text-align:center;font-size:72px;padding:6px}.hidden{display:none}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{text-align:center;padding:9px 1px;background:#eef3ed;border-radius:9px;font-size:12px}.day.on{background:#bad6bd;font-weight:bold}.footer{text-align:center;font-size:12px;color:#789083;margin:20px}a{color:#235e49}</style></head><body><main><div class="eyebrow">EVA · LIFE LEDGER</div><h1>日日自省，渐渐成林。🌱</h1><p>修身与成长双账本 · 私密本地记录</p><div class="stats"><div class="tile"><span>功</span><strong id="good">0</strong></div><div class="tile"><span>过</span><strong id="bad">0</strong></div><div class="tile"><span>成长</span><strong id="growth">0</strong></div></div><section><div class="tabs"><button id="tabToday" onclick="tab('today')">今日记录</button><button class="alt" id="tabHistory" onclick="tab('history')">历史日历</button><button class="alt" id="tabTree" onclick="tab('tree')">人生之树</button></div></section><div id="today"><section><h2>记录一件事</h2><label>日期<input id="date" type="date"></label><label>所属账本<select id="type"><option value="good">功 · 修身善行</option><option value="bad">过 · 需要改正</option><option value="growth">成长 · 长期建设</option><option value="reflection">仅反思 · 不计分</option></select></label><label>行为描述<textarea id="note" placeholder="发生了什么？尽量描述事实，不急于评判。"></textarea></label><label>分值<select id="points"><option value="1">1 · 轻微</option><option value="3">3 · 普通</option><option value="5">5 · 重要</option><option value="10">10 · 重大（仅功过）</option></select></label><button onclick="addEntry()">保存记录</button><p class="small">同一事件不重复计分；修复行为另记，不删除原过失。成长账本不设负分。</p></section><section><h2>今日一省</h2><textarea id="reflection" placeholder="今天值得肯定什么？需要改正什么？明天如何行动？"></textarea><button onclick="saveReflection()">保存反思</button></section><section><h2>当日记录</h2><div id="entries"></div></section></div><div id="history" class="hidden"><section><h2>近30天</h2><div class="calendar" id="calendar"></div><p class="small">高亮代表当天有记录。切换日期可在「今日记录」中查看或补记。</p></section><section><h2>所有记录</h2><div id="allEntries"></div></section></div><div id="tree" class="hidden"><section><h2>人生之树</h2><div class="tree" id="treeIcon">🌱</div><p id="treeInfo" style="text-align:center"></p><p class="small">树木依据累计记录天数成长，不以功过净分评判人格。</p></section></div><section><h2>数据管理</h2><p class="small">数据只存于本设备当前浏览器。请定期导出 JSON，清理浏览器数据或卸载 App 可能丢失记录。</p><div class="row"><button onclick="backup()">导出 JSON 备份</button><button class="alt" onclick="document.getElementById('importFile').click()">导入备份</button></div><input id="importFile" type="file" accept=".json,application/json" onchange="restore(event)" style="display:none"></section><div class="footer">EVA Life Ledger · V1.1 · 不以分数衡量人的价值</div></main><script src="./app.js"></script></body></html>
